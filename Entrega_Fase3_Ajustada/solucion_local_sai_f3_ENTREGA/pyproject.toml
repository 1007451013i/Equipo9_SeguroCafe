[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cafe-sai-modelos-equipo9"
version = "0.1.0"
description = "Capa de inferencia oficial para Seguro Agrícola Indexado Cafetero (Quindío/Nariño) — Informe Mejorado Entrega_2"
readme = "README_PACKAGE.md"
requires-python = ">=3.10,<3.13"
license = { text = "Propietario - Proyecto académico MIAD 2026" }
authors = [
  { name = "Equipo 9 Seguro Agrícola Indexado Cafetero" }
]
keywords = [
  "seguro agricola indexado",
  "cafe",
  "narino",
  "quindio",
  "spi-3",
  "machine learning",
  "inference package",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

dependencies = [
  "numpy==1.26.4",
  "scipy==1.11.4",
  "pandas==2.1.4",
  "scikit-learn==1.3.2",
  "joblib==1.3.2",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "pydantic>=2.5,<3.0",
  "httpx>=0.27,<1.0",
]
dashboard = [
  "streamlit>=1.32,<2.0",
  "plotly>=5.18,<6.0",
]
dev = [
  "pytest>=8.0,<9.0",
  "build>=1.1,<2.0",
  "hatchling>=1.24",
]
all = [
  "cafe-sai-modelos-equipo9[api,dashboard,dev]",
]

[project.urls]
Homepage = "file://README.md"
Source = "file://."

[tool.hatch.build.targets.wheel]
packages = ["package_src/cafe_sai_modelos_equipo9"]
exclude = [
  "package_src/cafe_sai_modelos_equipo9/_build/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "package_src/**",
  "models_artifacts/**",
  "tests/**",
  "README.md",
  "requirements.txt",
]
exclude = [
  "models_artifacts/**/*.joblib",
]
